<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            min-height: 100vh;
        }

        .pay-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 48px rgba(194, 65, 12, 0.12);
        }

        .pay-title {
            color: #c2410c;
            font-weight: 700;
        }

        .payment-panel {
            border: 1px solid #fed7aa;
            border-radius: 18px;
            background: #fffaf5;
        }
    </style>
    <script>
        function togglePaymentFields() {
            const method = document.getElementById('methodInput').value;
            const voucherFields = document.getElementById('voucherFields');
            const codFields = document.getElementById('codFields');

            voucherFields.style.display = method === 'VOUCHER' ? 'block' : 'none';
            codFields.style.display = method === 'COD' ? 'block' : 'none';
        }

        document.addEventListener('DOMContentLoaded', togglePaymentFields);
    </script>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="pay-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h1 class="pay-title h3 mb-1">Pay Order</h1>
                        <p class="text-muted mb-0">Choose your preferred payment method for this order.</p>
                    </div>
                    <a class="btn btn-outline-secondary" th:href="@{/order/history}">Back to History</a>
                </div>

                <div class="row g-4">
                    <div class="col-md-5">
                        <div class="payment-panel p-3 h-100">
                            <h2 class="h5 mb-3">Order Summary</h2>
                            <div class="mb-2">
                                <div class="text-muted small">Order ID</div>
                                <div class="fw-semibold" th:text="${order.id}">order-id</div>
                            </div>
                            <div class="mb-2">
                                <div class="text-muted small">Customer</div>
                                <div class="fw-semibold" th:text="${order.author}">customer</div>
                            </div>
                            <div class="mb-3">
                                <div class="text-muted small">Status</div>
                                <div class="fw-semibold" th:text="${order.status}">WAITING_PAYMENT</div>
                            </div>
                            <h3 class="h6">Products</h3>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item px-0" th:each="product : ${order.products}">
                                    <span th:text="${product.productName}">Product</span>
                                    <span class="text-muted" th:text="' x' + ${product.productQuantity}">x1</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="col-md-7">
                        <div class="payment-panel p-3 p-md-4">
                            <form method="post" th:action="@{/order/pay/{orderId}(orderId=${order.id})}">
                                <div class="mb-3">
                                    <label class="form-label" for="methodInput">Payment Method</label>
                                    <select class="form-select" id="methodInput" name="method" onchange="togglePaymentFields()">
                                        <option value="VOUCHER">Voucher Code</option>
                                        <option value="COD">Cash on Delivery</option>
                                    </select>
                                </div>

                                <div id="voucherFields">
                                    <div class="mb-3">
                                        <label class="form-label" for="voucherCodeInput">Voucher Code</label>
                                        <input class="form-control" id="voucherCodeInput" name="voucherCode" placeholder="ESHOP1234ABC5678" type="text">
                                    </div>
                                </div>

                                <div id="codFields">
                                    <div class="mb-3">
                                        <label class="form-label" for="addressInput">Delivery Address</label>
                                        <textarea class="form-control" id="addressInput" name="address" placeholder="Enter delivery address" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" for="deliveryFeeInput">Delivery Fee</label>
                                        <input class="form-control" id="deliveryFeeInput" name="deliveryFee" placeholder="15000" type="text">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end mt-4">
                                    <button class="btn btn-primary" type="submit">Submit Payment</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
