<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #fff8f1;
        }

        .detail-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(180, 83, 9, 0.12);
        }

        .detail-title {
            color: #b45309;
            font-weight: 700;
        }

        .status-pill {
            border-radius: 999px;
            font-size: 0.85rem;
            padding: 0.45rem 0.8rem;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="detail-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h1 class="detail-title h3 mb-1">Payment Detail</h1>
                        <p class="text-muted mb-0">Customer-facing summary of a single payment.</p>
                    </div>
                    <a class="btn btn-outline-secondary" th:href="@{/payment/detail}">Search Again</a>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Payment ID</div>
                            <div class="fw-semibold" th:text="${payment.id}">payment-id</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Method</div>
                            <div class="fw-semibold" th:text="${payment.method}">VOUCHER</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Status</div>
                            <span class="badge text-bg-warning status-pill" th:text="${payment.status}">PENDING</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Order ID</div>
                            <div class="fw-semibold" th:text="${payment.order.id}">order-id</div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <h2 class="h5 mb-3">Payment Data</h2>
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="entry : ${payment.paymentData}">
                            <span class="text-capitalize" th:text="${entry.key}">key</span>
                            <span class="fw-semibold" th:text="${entry.value}">value</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
