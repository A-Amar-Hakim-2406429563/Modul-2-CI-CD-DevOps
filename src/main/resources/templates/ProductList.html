<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Product List - ADV Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #FFEAD3;
    }

    .card-custom {
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
    }

    .title {
      color: #9E3B3B;
      font-weight: bold;
    }

    .btn-create {
      background-color: #EA7B7B;
      border: none;
      color: white;
    }

    .btn-create:hover {
      background-color: #D25353;
    }

    .btn-edit {
      background-color: #9E3B3B;
      border: none;
      color: white;
    }

    .btn-edit:hover {
      background-color: #D25353;
    }

    .btn-delete {
      background-color: #D25353;
      border: none;
      color: white;
    }

    .btn-delete:hover {
      background-color: #9E3B3B;
    }

    thead {
      background-color: #9E3B3B;
      color: white;
    }

    table {
      border-radius: 10px;
      overflow: hidden;
    }

    tr:hover {
      background-color: #fff2e6;
    }
  </style>
</head>

<body>

<div class="container mt-5">
  <div class="card-custom">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="title">Product List</h2>
      <a th:href="@{/product/create}" class="btn btn-create">
        + Create Product
      </a>
    </div>

    <table class="table table-hover align-middle">
      <thead>
      <tr>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Quantity</th>
        <th class="text-center">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="product: ${products}">
        <td th:text="${product.productId}"></td>
        <td th:text="${product.productName}"></td>
        <td th:text="${product.productQuantity}"></td>
        <td class="text-center">

          <a th:href="@{/product/edit/{id}(id=${product.productId})}"
             class="btn btn-edit btn-sm me-2">
            Edit
          </a>

          <a th:href="@{/product/delete/{id}(id=${product.productId})}"
             class="btn btn-delete btn-sm"
             onclick="return confirm('Are you sure you want to delete this product?')">
            Delete
          </a>

        </td>
      </tr>
      </tbody>
    </table>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
