<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fef6e4, #f3d2c1);
            min-height: 100vh;
        }

        .page-card {
            background-color: #fffaf3;
            border: 1px solid #f1d4b5;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(93, 64, 55, 0.12);
        }

        .page-title {
            color: #8c3d23;
            font-weight: 700;
        }

        .btn-primary {
            background-color: #c8553d;
            border-color: #c8553d;
        }

        .btn-primary:hover {
            background-color: #a94430;
            border-color: #a94430;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="page-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="page-title h3 mb-1">Create Order</h1>
                        <p class="text-muted mb-0">Fill in the buyer and product information to create a new order.</p>
                    </div>
                    <a class="btn btn-outline-secondary" th:href="@{/order/history}">Order History</a>
                </div>

                <form th:action="@{/order/create}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="authorInput">Customer Name</label>
                        <input class="form-control" id="authorInput" name="author" placeholder="Enter customer name" type="text">
                    </div>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="productIdInput">Product ID</label>
                            <input class="form-control" id="productIdInput" name="productId" placeholder="Product ID" type="text">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label" for="productNameInput">Product Name</label>
                            <input class="form-control" id="productNameInput" name="productName" placeholder="Product name" type="text">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="quantityInput">Quantity</label>
                            <input class="form-control" id="quantityInput" min="1" name="productQuantity" placeholder="1" type="number">
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a class="btn btn-light" th:href="@{/}">Cancel</a>
                        <button class="btn btn-primary" type="submit">Create Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
