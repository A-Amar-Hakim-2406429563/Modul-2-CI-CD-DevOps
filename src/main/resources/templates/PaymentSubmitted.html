<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #f0fdf4, #dcfce7);
            min-height: 100vh;
        }

        .submitted-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 18px 44px rgba(22, 101, 52, 0.12);
        }

        .submitted-title {
            color: #166534;
            font-weight: 700;
        }

        .id-box {
            background: #f0fdf4;
            border: 1px dashed #22c55e;
            border-radius: 18px;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="submitted-card p-4 p-md-5 text-center">
                <h1 class="submitted-title h3 mb-2">Payment Submitted</h1>
                <p class="text-muted mb-4">Your payment request has been created successfully.</p>

                <div class="id-box p-4 mb-4">
                    <div class="text-muted small mb-1">Payment ID</div>
                    <div class="fs-4 fw-bold" th:text="${paymentId}">payment-id</div>
                </div>

                <div class="row g-3 text-start mb-4">
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Method</div>
                            <div class="fw-semibold" th:text="${payment.method}">VOUCHER</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Status</div>
                            <div class="fw-semibold" th:text="${payment.status}">SUCCESS</div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2">
                    <a class="btn btn-outline-success" th:href="@{/payment/detail/{paymentId}(paymentId=${paymentId})}">View Payment Detail</a>
                    <a class="btn btn-success" th:href="@{/order/history}">Back to Orders</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
