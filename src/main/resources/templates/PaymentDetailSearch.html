<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Find Payment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(145deg, #f2f7ff, #dbeafe);
            min-height: 100vh;
        }

        .search-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(37, 99, 235, 0.14);
        }

        .search-title {
            color: #1d4ed8;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="search-card p-4 p-md-5">
                <h1 class="search-title h3 mb-2">Find Payment Detail</h1>
                <p class="text-muted mb-4">Enter a payment ID to see the payment information.</p>

                <form method="get" onsubmit="event.preventDefault(); window.location.href='/payment/detail/' + document.getElementById('paymentIdInput').value;">
                    <div class="mb-3">
                        <label class="form-label" for="paymentIdInput">Payment ID</label>
                        <input class="form-control" id="paymentIdInput" name="paymentId" placeholder="Enter payment ID" type="text">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a class="btn btn-outline-secondary" th:href="@{/payment/admin/list}">Admin View</a>
                        <button class="btn btn-primary" type="submit">View Payment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
