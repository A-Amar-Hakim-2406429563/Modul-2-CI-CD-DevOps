<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #f6fff8, #d8f3dc);
            min-height: 100vh;
        }

        .history-card {
            background-color: #ffffff;
            border-radius: 22px;
            box-shadow: 0 18px 40px rgba(32, 81, 59, 0.14);
        }

        .history-title {
            color: #2d6a4f;
            font-weight: 700;
        }

        .btn-success {
            background-color: #2d6a4f;
            border-color: #2d6a4f;
        }

        .btn-success:hover {
            background-color: #1f4f39;
            border-color: #1f4f39;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="history-card p-4 p-md-5">
                <h1 class="history-title h3 mb-2">Find Order History</h1>
                <p class="text-muted mb-4">Search all orders by customer name.</p>

                <form th:action="@{/order/history}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="historyAuthorInput">Customer Name</label>
                        <input class="form-control" id="historyAuthorInput" name="author" placeholder="Enter customer name" type="text">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a class="btn btn-outline-secondary" th:href="@{/order/create}">Create Order</a>
                        <button class="btn btn-success" type="submit">Show History</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
