<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fb;
        }

        .list-card {
            background-color: #ffffff;
            border-radius: 22px;
            box-shadow: 0 18px 42px rgba(42, 67, 101, 0.12);
        }

        .list-title {
            color: #244c7c;
            font-weight: 700;
        }

        thead {
            background-color: #244c7c;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="list-card p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="list-title h3 mb-1">Order History</h1>
                <p class="text-muted mb-0">
                    Showing orders for <span th:text="${author}">Customer</span>
                </p>
            </div>
            <a class="btn btn-outline-primary" th:href="@{/order/history}">Search Again</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Order Time</th>
                    <th>Status</th>
                    <th>Products</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td class="text-center text-muted" colspan="5">No orders found for this customer.</td>
                </tr>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">order-id</td>
                    <td th:text="${order.orderTime}">0</td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${order.status}">WAITING_PAYMENT</span>
                    </td>
                    <td>
                        <div th:each="product : ${order.products}">
                            <span th:text="${product.productName}">Product</span>
                            <span class="text-muted" th:text="' x' + ${product.productQuantity}">x1</span>
                        </div>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-primary"
                           th:if="${order.status == 'WAITING_PAYMENT'}"
                           th:href="@{/order/pay/{orderId}(orderId=${order.id})}">Pay</a>
                        <span class="text-muted small" th:unless="${order.status == 'WAITING_PAYMENT'}">No action</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
