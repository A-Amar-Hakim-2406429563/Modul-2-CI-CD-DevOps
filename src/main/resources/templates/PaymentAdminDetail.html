<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }

        .review-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
        }

        .review-title {
            color: #0f172a;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="review-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h1 class="review-title h3 mb-1">Review Payment</h1>
                        <p class="text-muted mb-0">Approve or reject a payment from the admin panel.</p>
                    </div>
                    <a class="btn btn-outline-secondary" th:href="@{/payment/admin/list}">Back to List</a>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Payment ID</div>
                            <div class="fw-semibold" th:text="${payment.id}">payment-id</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="border rounded-4 p-3 h-100">
                            <div class="text-muted small mb-1">Current Status</div>
                            <div class="fw-semibold" th:text="${payment.status}">PENDING</div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h2 class="h5 mb-3">Payment Data</h2>
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="entry : ${payment.paymentData}">
                            <span class="text-capitalize" th:text="${entry.key}">key</span>
                            <span class="fw-semibold" th:text="${entry.value}">value</span>
                        </li>
                    </ul>
                </div>

                <div class="d-flex gap-2">
                    <form method="post" th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}">
                        <input name="status" type="hidden" value="SUCCESS">
                        <button class="btn btn-success" type="submit">Accept Payment</button>
                    </form>
                    <form method="post" th:action="@{/payment/admin/set-status/{paymentId}(paymentId=${payment.id})}">
                        <input name="status" type="hidden" value="REJECTED">
                        <button class="btn btn-danger" type="submit">Reject Payment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
